# Local services for development. Real values come from .env, never from this file.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
      POSTGRES_DB: ${POSTGRES_DB:-ams}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '${REDIS_PORT:-6379}:6379'
  # Local mail trap (EPIC-LGN-02, ST-LGN02-000-BE-02): catches every e-mail the application sends. Web page and API on 8025, SMTP on 1025. Development, test and UAT only.
  mailtrap:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '${MAIL_TRAP_SMTP_PORT:-1025}:1025'
      - '${MAIL_TRAP_WEB_PORT:-8025}:8025'
volumes:
  pgdata:
